name: Inspect native accessory sizing
on:
  push:
    branches: [native-size-inspection]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile UIKit metadata probe
        shell: bash
        run: |
          mkdir -p .build/Sizing.app
          xcrun --sdk iphonesimulator clang -target "$(uname -m)-apple-ios26.0-simulator" \
            -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" -fobjc-arc \
            -framework Foundation -framework UIKit scripts/inspect-sizing.m -o .build/Sizing.app/Sizing
          cat > .build/Sizing.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.paht25.sizing</string>
          <key>CFBundleExecutable</key><string>Sizing</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          </dict></plist>
          PLIST
      - name: Inspect runtime sizing interfaces
        shell: bash
        run: |
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for r,v in d["devices"].items() if "iOS-2" in r for x in v if "iPhone" in x["name"]))')"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl spawn "$DEVICE" "$PWD/.build/Sizing.app/Sizing" 2>&1 | tee .build/native-sizes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-sizing-metadata
          path: .build/native-sizes.txt
          if-no-files-found: ignore
