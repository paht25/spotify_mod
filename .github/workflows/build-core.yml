name: Compile and test independent integration core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-core.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Test hook ownership and preference primitives on macOS
        run: bash scripts/test-core-macos.sh
      - name: Compile ARM64 iOS core static library
        run: bash scripts/build-core.sh
      - name: Upload core library and test executable
        uses: actions/upload-artifact@v4
        with:
          name: integration-core-only-not-an-injectable-tweak
          path: |
            build/core-ios/libUnifiedSpotifyCore.a
            build/core-tests/CoreTests
          if-no-files-found: error
          retention-days: 7
