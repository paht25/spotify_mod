name: Compile and test integration - feed-c-bridge-v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-core.yml

permissions:
  contents: read

jobs:
  core:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record Apple toolchain
        run: |
          echo "BUILD REVISION feed-c-bridge-v2"
          git rev-parse HEAD
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Test core, transport, Chroma wire codec and Eevee feed integration
        run: bash scripts/test-core-macos.sh
      - name: Compile ARM64 iOS core static library
        run: bash scripts/build-core.sh
      - name: Build isolated feed dylib and experimental Debian package
        run: bash scripts/build-experimental.sh
      - name: Validate Debian package structure with dpkg
        run: |
          brew install dpkg
          dpkg-deb --info build/experimental/UnifiedSpotify-FeedTest_0.1.0-test1.deb
          dpkg-deb --contents build/experimental/UnifiedSpotify-FeedTest_0.1.0-test1.deb
      - name: Upload core library and test executable
        uses: actions/upload-artifact@v4
        with:
          name: integration-core-only-not-an-injectable-tweak
          path: |
            build/core-ios/libUnifiedSpotifyCore.a
            build/core-tests/CoreTests
            build/core-tests/TransportTests
            build/core-tests/EeveeFeedTests
            build/core-tests/FeedIntegrationTests
            build/core-tests/HookTests
            build/core-tests/feed-symbols.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload experimental injection files
        uses: actions/upload-artifact@v4
        with:
          name: experimental-feed-only-Sideloadly-test
          path: |
            build/experimental/UnifiedSpotifyExperimental.dylib
            build/experimental/UnifiedSpotify-FeedTest_0.1.0-test1.deb
            build/experimental/package-manifest.json
            build/experimental/dependencies.txt
          if-no-files-found: error
          retention-days: 7
