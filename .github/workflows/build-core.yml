name: Personal independent modules - v9-9190

on:
  workflow_dispatch:
  push:
    branches: [main, personal-v9-9190]
    paths:
      - .github/workflows/build-core.yml
      - Integration/**
      - Sources/**
      - Tests/**
      - scripts/**
      - tools/**
      - Resources/**
      - Generated/**
      - target.json

permissions:
  contents: read

jobs:
  core:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/build/theos
    steps:
      - uses: actions/checkout@v4
      - name: Check source for unresolved merge conflicts
        run: node tools/check-source-conflicts.mjs
      - name: Record Apple toolchain
        run: |
          echo "BUILD REVISION personal-independent-v9-9190"
          git rev-parse HEAD
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Test core, transport, Chroma wire codec and Eevee feed integration
        run: bash scripts/test-core-macos.sh
      - name: Test composed transport, services and audio ad policy boundaries
        run: bash scripts/test-composition-macos.sh
      - name: Test independent audio spectrum
        run: bash scripts/test-personal-macos.sh
      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 8167f59de02fd32cf45b16bfcb1330dfa5c9974c
          path: build/theos
          submodules: recursive
      - name: Install Theos build tools
        run: brew install make dpkg ldid
      - name: Build full Chroma source with composed Eevee modules and Live Activity
        run: bash scripts/build-unified.sh
      - name: Validate Debian package structure with dpkg
        run: |
          dpkg-deb --info build/unified/UnifiedSpotify-Personal_0.6.2-test1.deb
          dpkg-deb --contents build/unified/UnifiedSpotify-Personal_0.6.2-test1.deb
      - name: Upload core library and test executable
        uses: actions/upload-artifact@v4
        with:
          name: integration-core-only-not-an-injectable-tweak
          path: |
            build/core-ios/libUnifiedSpotifyCore.a
            build/core-tests/CoreTests
            build/core-tests/TransportTests
            build/core-tests/EeveeFeedTests
            build/core-tests/FeedIntegrationTests
            build/core-tests/HookTests
            build/core-tests/feed-symbols.txt
            build/core-tests/SharingTests
            build/core-tests/PremiumTests
            build/composition-tests/CompositionTests
            build/composition-tests/ServiceHooksTests
            build/composition-tests/AudioAdHooksTests
            build/personal-tests/AudioSpectrumTests
            build/personal-tests/PersonalAssetTests
            build/personal-tests/LocalHTTPTests
            build/core-ios/protobuf/protobuf-source-commit.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload private integration candidate and Live Activity support
        uses: actions/upload-artifact@v4
        with:
          name: personal-independent-v9-9190-Sideloadly-test
          path: build/unified/
          if-no-files-found: error
          retention-days: 7
